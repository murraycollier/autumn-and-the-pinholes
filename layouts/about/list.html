{{ define "main" }}
<div class="wrap">
  <header class="page-head reveal">
    <p class="kicker">the story so far</p>
    <h1>{{ .Title }}</h1>
  </header>

  <figure class="band-photo reveal">
    <img src="{{ "images/band/band-01.svg" | relURL }}" alt="Illustration of the five band members standing in front of a tree" width="1200" height="800" loading="lazy">
    <figcaption>Five people, one tree, zero coordinated outfits.</figcaption>
  </figure>

  <article class="prose reveal">
    {{ .Content }}
  </article>

  <section class="members">
    <h2 class="block-title reveal">The band</h2>
    <div class="member-grid">
      {{- range hugo.Data.members }}
      <article class="member card reveal" style="--tilt: {{ .tilt }}">
        <div class="member-avatar" aria-hidden="true">{{ substr .name 0 1 }}</div>
        <h3>{{ .name }}</h3>
        <p class="meta">{{ .role }}</p>
        <p>{{ .bio }}</p>
      </article>
      {{- end }}
    </div>
  </section>
</div>
{{ end }}

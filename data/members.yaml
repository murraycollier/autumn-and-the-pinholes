- name: "Autumn"
  role: "Vocals, guitar, melodica"
  tilt: "-4deg"
  bio: "Writes songs about allotments, ex-boyfriends and the moon. Sings like she is telling you a secret in a pub toilet, then hits the big note anyway."

- name: "Sam"
  role: "Fiddle, mandolin, backing vocals"
  tilt: "3deg"
  bio: "Has been playing the fiddle since age seven and is still not sure the neighbours forgive him. Responsible for most of the key changes and all of the wobbles."

- name: "Biscuit"
  role: "Cat. Tempo consultant."
  tilt: "0deg"
  bio: "Has never once been on time. Sleeps on the amp, judges the setlist from the windowsill and has been known to walk off stage mid-song. Not available for interviews."

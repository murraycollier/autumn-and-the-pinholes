- name: "Riley"
  role: "Vocals, guitar, melodica"
  tilt: "-4deg"
  bio: "Writes songs about allotments, bad weather and the moon. Sings like they are telling you a secret in a pub toilet, then hits the big note anyway."

- name: "Josh"
  role: "Good looks"
  tilt: "3deg"
  bio: "Joined for the biscuits and his good looks, and has been asked to do very little since. Stands at the front for the photos."

- name: "Autumn (the cat)"
  role: "Cat. Tempo consultant."
  tilt: "0deg"
  bio: "Has never once been on time. Sleeps on the amp, judges the setlist from the windowsill and has been known to walk off stage mid-song. Not available for interviews."
